[versions]
# Build tools
agp = "9.2.1"
kotlin = "2.3.21"
ksp = "2.3.10"
# AndroidX
androidxAppCompat = "1.7.1"
androidx-annotation = "1.10.0"
androidxCardView = "1.0.0"
androidxCore = "1.19.0"
androidxConstraintLayout = "2.2.1"
androidxLifecycle = "2.11.0"
androidxRecyclerView = "1.4.0"
androidxRoom = "2.8.4"
androidxWork = "2.11.2"
androidxSwipeRefreshLayout = "1.2.0"

# Google
material = "1.14.0"
# Coroutines
coroutines = "1.11.0"
# Other
coil = "2.7.0"
eventbus = "3.3.1"
gson = "2.14.0"
jsoup = "1.22.2"
lottie = "6.7.1"
multiType = "4.3.0"
okhttp = "5.4.0"
persistentCookieJar = "v1.0.1"
photoView = "2.3.0"
timber = "5.0.1"
# Shiply
shiply = "2.2.0"

fragment = "1.8.9"
junit = "4.13.2"

[libraries]
# AndroidX
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidxAppCompat" }
androidx-cardview = { group = "androidx.cardview", name = "cardview", version.ref = "androidxCardView" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "androidxConstraintLayout" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-core-base = { group = "androidx.core", name = "core", version.ref = "androidxCore" }
androidx-lifecycle-common-java8 = { group = "androidx.lifecycle", name = "lifecycle-common-java8", version.ref = "androidxLifecycle" }
androidx-lifecycle-livedata-ktx = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "androidxLifecycle" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "androidxRecyclerView" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "androidxRoom" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "androidxRoom" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "androidxRoom" }
androidx-swiperefreshlayout = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "androidxSwipeRefreshLayout" }
androidx-work-runtime = { group = "androidx.work", name = "work-runtime", version.ref = "androidxWork" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidx-annotation" }
fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }

# Google
google-material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# Coroutines
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlin-stdlib-jdk8 = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib-jdk8", version.ref = "kotlin" }

# Other
coil = { group = "io.coil-kt", name = "coil", version.ref = "coil" }
eventbus = { group = "org.greenrobot", name = "eventbus", version.ref = "eventbus" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }
lottie = { group = "com.airbnb.android", name = "lottie", version.ref = "lottie" }
multitype = { group = "com.drakeet.multitype", name = "multitype", version.ref = "multiType" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
persistentcookiejar = { group = "com.github.franmontiel", name = "PersistentCookieJar", version.ref = "persistentCookieJar" }
photoview = { group = "com.github.chrisbanes", name = "PhotoView", version.ref = "photoView" }
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }
# Shiply
shiply-upgrade = { group = "com.tencent.shiply", name = "upgrade", version.ref = "shiply" }
shiply-upgrade-ui = { group = "com.tencent.shiply", name = "upgrade-ui", version.ref = "shiply" }

junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize" }
ksp = { id = "com.google.devtools.ksp" }